# Production stack for the Synology NAS, driven by infra/synology/deploy.sh.
# IMAGE_TAG is injected by the deploy script; everything else comes from the .env file next to
# this compose file on the NAS. DSM already owns ports 80/443, so HTTPS is terminated by the DSM
# reverse proxy and the app only listens on the NAS loopback.
#
# Rules the deploy script relies on:
#   - "name:" equals PROJECT in deploy.sh (containers become <project>-<service>-1)
#   - every service built by the workflow uses image ghcr.io/<owner>/<project>-<service>:${IMAGE_TAG}
#   - no container_name: (it breaks the name-conflict check and parallel recreation)
#   - give HTTP services a healthcheck; services without one only need to stay "running"
name: __PROJECT__

services:
  app:
    image: ghcr.io/__GHCR_OWNER__/__PROJECT__-app:${IMAGE_TAG:?IMAGE_TAG is set by deploy.sh}
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    ports:
      - "${HTTP_BIND:-127.0.0.1:__HOST_PORT__}:__CONTAINER_PORT__"
    environment:
      - PORT=__CONTAINER_PORT__
    volumes:
      - ${DATA_DIR:?set DATA_DIR in .env}:/data
__HEALTHCHECK__

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Every job starts from read-only and asks for more explicitly.
permissions:
  contents: read

# Deployments run one at a time and a running deploy is never cancelled halfway.
concurrency:
  group: synology-production
  cancel-in-progress: false

env:
  # Must be lowercase. Images are pushed as $IMAGE_PREFIX-<service>:<commit sha>,
  # matching IMAGE_PREFIX and SERVICES in infra/synology/deploy.sh.
  IMAGE_PREFIX: ghcr.io/__GHCR_OWNER__/__PROJECT__

jobs:
  # Replace the steps with the project's own checks. This job is the gate that keeps a
  # broken main (for example a half-committed change) from ever reaching the NAS.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  build:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [app]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Images are tagged only with the commit SHA so every deploy is reproducible and
      # the NAS can roll back to an exact previous build. No mutable "latest" tag.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: __DOCKERFILE__
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Configure SSH
        env:
          NAS_SSH_PRIVATE_KEY: ${{ secrets.NAS_SSH_PRIVATE_KEY }}
          NAS_SSH_KNOWN_HOSTS: ${{ secrets.NAS_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$NAS_SSH_PRIVATE_KEY" > "$HOME/.ssh/nas_deploy"
          chmod 600 "$HOME/.ssh/nas_deploy"
          printf '%s\n' "$NAS_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts_nas"

      # The NAS key is locked to a forced command, so the only thing this can do is
      # "deploy <sha>". The registry login is this job's GITHUB_TOKEN sent over stdin:
      # it expires when the job ends, so the NAS never stores a registry credential.
      - name: Deploy to Synology NAS
        env:
          NAS_SSH_HOST: ${{ secrets.NAS_SSH_HOST }}
          NAS_SSH_PORT: ${{ secrets.NAS_SSH_PORT }}
          NAS_SSH_USER: ${{ secrets.NAS_SSH_USER }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n%s\n' "$REGISTRY_USER" "$REGISTRY_TOKEN" |
            ssh -i "$HOME/.ssh/nas_deploy" -p "$NAS_SSH_PORT" \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts_nas" \
              -o ConnectTimeout=20 \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=4 \
              "$NAS_SSH_USER@$NAS_SSH_HOST" "deploy $GITHUB_SHA"

      - name: Remove SSH key
        if: always()
        run: rm -f "$HOME/.ssh/nas_deploy"
